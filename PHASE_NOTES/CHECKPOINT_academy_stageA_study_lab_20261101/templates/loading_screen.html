<!DOCTYPE html>
<html lang="en">
<!-- Standalone reference animation; not a MYELIN Web application entry point. -->
<head>
<meta charset="UTF-8">
<title>MYELIN — Loading</title>
<style>
  :root {
    --base: #0B0F19;
    --surface-soft: #111827;
    --text: #E5E7EB;
    --muted: #94A3B8;
    --cyan: #38BDF8;
    --cyan-dim: #1E7BAE;
    --border: #334155;
    --font-ui: "Segoe UI", "Inter", sans-serif;
    --font-mono: "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    background: var(--base);
    font-family: var(--font-ui);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--cyan) 7%, var(--base)) 0%, var(--base) 65%);
  }
  #bgCanvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; }

  .corner-trace { position: absolute; opacity: 0.55; }
  .corner-trace.tl { top: 26px; left: 26px; }
  .corner-trace.br { bottom: 26px; right: 26px; transform: rotate(180deg); }
  .corner-trace svg { width: 220px; height: 60px; display: block; }
  .corner-trace .line { fill: none; stroke: var(--border); stroke-width: 1; }
  .corner-trace .node { fill: var(--muted); }
  .corner-trace .pulse { fill: var(--cyan); filter: drop-shadow(0 0 4px rgba(56,189,248,0.6)); }

  .panel {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }

  .logo-wrap { position: relative; width: 260px; height: 240px; margin-bottom: 8px; }
  .logo-glow {
    position: absolute; inset: -30px;
    background: radial-gradient(circle, rgba(56,189,248,0.28) 0%, rgba(167,139,250,0.12) 45%, transparent 70%);
    filter: blur(6px);
    animation: pulseGlow 3.2s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.7; transform: scale(0.97); }
    50% { opacity: 1; transform: scale(1.04); }
  }
  .logo-wrap img {
    position: relative; z-index: 1;
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 0 22px rgba(56,189,248,0.25));
  }

  .wordmark {
    font-size: 44px; font-weight: 800; letter-spacing: 14px;
    color: var(--text); margin: 6px 0 0 -14px;
  }
  .tagline {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 13px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--cyan); opacity: 0.85;
  }

  .status {
    margin-top: 46px;
    font-size: 13px; color: var(--muted);
  }
  .status .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; }
  }

  .track {
    margin-top: 18px;
    width: 320px; height: 6px;
    border-radius: 999px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
  }
  .fill {
    position: absolute; top: 0; left: 0; height: 100%;
    width: 40%; border-radius: 999px;
    background: linear-gradient(90deg, #A78BFA, var(--cyan));
    animation: loadSweep 1.8s ease-in-out infinite;
  }
  @keyframes loadSweep {
    0%   { left: -40%; width: 40%; }
    50%  { left: 30%;  width: 55%; }
    100% { left: 100%; width: 40%; }
  }

  .version {
    position: absolute; bottom: 22px; left: 0; right: 0;
    text-align: center;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1px;
    color: #475569;
  }
</style>
</head>

    <div class="wordmark">MYELIN</div>
    <div class="tagline">Guide &#8211; Recover &#8211; Focus</div>

    <div class="status"><span id="statusText">Initializing Control Station</span><span class="dots"></span></div>
    <div class="track"><div class="fill"></div></div>
  </div>

  <div class="version">MYELIN Core v1.5.0 &nbsp;&#183;&nbsp; Neural Telemetry Interface</div>
</div>

<script>
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, nodes = [], edges = [], pulses = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    build();
  }
  function build() {
    nodes = []; edges = [];
    const cols = 10, rows = 6;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        nodes.push({
          x: (c / (cols - 1)) * W + (Math.random() - 0.5) * 60,
          y: (r / (rows - 1)) * H + (Math.random() - 0.5) * 60,
          r: 1.2 + Math.random() * 1.4
        });
      }
    }
    nodes.forEach((n, i) => {
      const dists = nodes.map((m, j) => ({ j, d: Math.hypot(n.x - m.x, n.y - m.y) }))
        .filter(o => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 2);
      dists.forEach(o => edges.push({ a: i, b: o.j }));
    });
  }
  function spawnPulse() {
    if (!edges.length) return;
    const e = edges[Math.floor(Math.random() * edges.length)];
    pulses.push({ a: nodes[e.a], b: nodes[e.b], t: 0, speed: 0.008 + Math.random() * 0.01 });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    edges.forEach(e => {
      const a = nodes[e.a], b = nodes[e.b];
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(56,189,248,0.08)'; ctx.lineWidth = 1; ctx.stroke();
    });
    nodes.forEach(n => {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(56,189,248,0.18)'; ctx.fill();
    });
    pulses.forEach(p => {
      const x = p.a.x + (p.b.x - p.a.x) * p.t;
      const y = p.a.y + (p.b.y - p.a.y) * p.t;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
      g.addColorStop(0, 'rgba(56,189,248,0.8)'); g.addColorStop(1, 'rgba(56,189,248,0)');
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
      p.t += p.speed;
    });
    pulses = pulses.filter(p => p.t < 1);
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
  setInterval(spawnPulse, 220);

  const messages = [
    'Initializing Control Station',
    'Loading behavioral model',
    'Calibrating SINE stages',
    'Connecting telemetry feed',
  ];
  let mi = 0;
  setInterval(() => {
    mi = (mi + 1) % messages.length;
    document.getElementById('statusText').textContent = messages[mi];
  }, 1800);
</script>

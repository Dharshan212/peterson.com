    <style>
        body#publications {
            background-color: var(--bg-base) !important;
            color: var(--text-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body#publications main { padding-top: 6rem; padding-bottom: 4rem; }
        body#publications .section h2 {
            color: var(--text-light);
            font-family: monospace;
            letter-spacing: -0.02em;
        }
        .publications-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .publication-card {
            position: relative;
            overflow: hidden;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .publication-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
        }
        .publication-card h3 {
            color: var(--text-light);
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            line-height: 1.35;
        }
        .publication-card .journal {
            color: var(--accent-cyan);
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        .publication-card .abstract {
            color: var(--silver);
            line-height: 1.7;
            margin-bottom: 1.25rem;
        }
        .publication-card .pub-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .publication-card .tech-tag {
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent-purple);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }
        .publication-card .btn-primary {
            background: var(--accent-purple);
            box-shadow: 0 0 12px rgba(168,85,247,0.3);
        }
        .publication-card .btn-primary:hover { background: #9333ea; }
    </style>
</head>
